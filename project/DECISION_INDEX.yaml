reopen_policy:
  frozen_decision_may_reopen_only_if:
  - A causal/data-integrity defect invalidates it.
  - The selected real provider cannot support the contract and the incompatibility is demonstrated.
  - The user explicitly revises the strategy intent.
  - New evidence is registered under a new research revision rather than silently rewriting history.
  forbidden:
  - Re-researching a frozen decision merely because a new AI session starts.
  - Copying values from another timeframe without an explicit decision.
  - Treating proposal/design completion as economic validation.

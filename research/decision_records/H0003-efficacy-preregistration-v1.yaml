sample:
  unit: Immutable leadership episode candidate id; at most one per episode.
  duplicate: Any duplicate id/episode, identity collision, altered snapshot or inconsistent clock fails closed.
  overlap: Keep all distinct candidates and overlapping forward windows; no thinning after outcomes.
  weighting: Equal event weights within each session, then equal occupied session weights.
  clocks: Historical bar-end assumed availability; not reconstructed live delivery or attainable fill.
horizons:
  primary_slots: 16
  secondary_slots: [4, 64]
  unit: Scheduled completed 15m slots on XNYS nominal 04:00-20:00 America/New_York grid.
  rationale: >-
    Four observed trading hours test continuation over the next part of a session
    after a one-session leadership context and one-hour persistence check. One hour
    is more immediate; one full session is longer exposure. Choose16 theoretically,
    not from labels or by copying the64-slot signal window. Closures consume no slot;
    missing/unsupported scheduled slots are never compressed.
  secondary_role: Descriptive only; neither changes primary nor creates a PASS/REJECT test.
label:
  name: DIRECT_PAIRED_FORWARD_CLOSE_PRICE_EXCESS
  own: SOXX_close_at_exact_t_plus_h / SOXX_close_at_candidate_t - 1
  benchmark: QQQ_close_at_exact_t_plus_h / QQQ_close_at_candidate_t - 1
  relative: own_minus_benchmark_on_identical_anchor_endpoint_and_scheduled_path
  reference: Completed candidate-slot closes from sealed paired vintage; gross opportunity marks, not fills.
  path: Both admitted series required at anchor and every scheduled slot t+1..t+h, same feed/unit/clock; no fill or stale/future benchmark substitution.
  missing: Immature before terminal deadline PENDING; mature missing supported slots after deadline UNRESOLVED. Never omit unresolved events or replace them with0.
  action_unit: Split/share-unit change or ambiguity anywhere anchor..endpoint makes that label UNRESOLVED; no new transformation or adjusted backfill.
  dividends: Raw price return excludes cash dividend reinvestment and total-return accounting; known cash distributions disclosed separately, never normalized into this price estimand.
  mfe_mae: NOT_PART_OF_V1
baseline:
  name: DIRECT_CONTEMPORANEOUS_QQQ_EXCESS_ZERO_NULL
  estimand: Session-balanced mean of event-level SOXX forward price return minus paired QQQ forward price return at16 slots.
  'null': Primary session-balanced expected post-signal SOXX price excess over QQQ <= 0.
  alternative: Primary session-balanced expected post-signal SOXX price excess over QQQ > 0.
  matched_controls: NONE; QQQ is the direct comparison, no non-event search/fallback engine.
  interpretation: Observational leadership persistence relative to QQQ; no timing-alpha or causal effect identification versus matched non-events.
absolute_relevance:
  role: SECONDARY_DESCRIPTIVE_SOXX_PRICE_RETURN
  rationale: Relative continuation is the approved thesis. A joint absolute-return gate would broaden the confirmatory condition; do not add it silently.
  interpretation: Relative PASS with negative SOXX direction is not LONG profit validation; always disclose absolute direction and prohibit promotion/account-return claims.
costs:

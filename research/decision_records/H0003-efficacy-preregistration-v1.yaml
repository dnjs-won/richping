  outcomes_this_action: FORBIDDEN
  next_action: H0003_FIRST_EFFICACY
  endpoint_scope: Exact endpoints and entire paired path must remain within admitted70-session scope; later missing labels retained UNRESOLVED, no opportunistic extra capture.

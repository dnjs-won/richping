      논의했다.
  - ref: rules.trigger[0]
    text: 일봉 롱 레짐이 허용되고 일봉 exhaustion blocker가 활성화되지 않은 상태에서 1시간봉 상대 MACD 하방 극단이 setup을
      만든다.
  - ref: rules.trigger[1]
    text: 그 setup 안에서 15분봉 MACD도 상대적으로 깊은 하방 영역에 있고 골든크로스 또는 확인된 가격 반전이 발생하면 최초 롱
      진입 후보가 된다.

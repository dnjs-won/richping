  prior_subfamilies: Frozen DLP-B vs DLP-A, blocker D0 vs D1, H1 S0 vs S1 and proposed
    alternatives retain separate unexecuted subfamily records. This combined-strategy
    study does not execute/resolve those comparisons or establish filter contributions.
  historical_search: Prior chart/indicator/discovery exposure is retained; no correction
    can make that cohort independent confirmation.
  trials: Keep ZERO_SIGNAL, failed, rejected and inconclusive reports. A new horizon/baseline/variant/confirmation
    span requires a new preregistered revision and expanded family accounting before
    fresh outcomes.
execution_admission:
  current_action: PREREGISTRATION_ONLY_NO_LABEL_ENGINE_NO_OUTCOME_ACCESS
  next_action: H0001_FIRST_ENTRY_EFFICACY
  preconditions: Verify this committed protocol hash, all dependencies, immutable
    candidate stream and evaluation manifest before accessing labels; record adapter/source
    hash, fixed vintage hashes, evaluation_as_of and output identity.
  empty_current_stream: Execute ZERO_SIGNAL disposition without market/benchmark/outcome
    reads. No performance evidence or meaningful numeric CI can be produced.
  nonempty_future_stream: Requires compatible immutable signal/control traces, outcome/action
    inputs and exact frozen bootstrap adapter; no provider migration in this action.
  sparse_evidence_routing: Preserve thresholds. After first ZERO_SIGNAL/INSUFFICIENT_EVIDENCE
    disposition, PM may promote LONG_HISTORY_PROVIDER_AND_VOLUME_EVIDENCE as the blocker
    to obtaining an informative cohort; no retroactive confirmation claim.

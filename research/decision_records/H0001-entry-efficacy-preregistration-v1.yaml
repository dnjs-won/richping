label_contract:
  version: H0001_ENTRY_MARK_PRICE_LABEL_V1
  horizon_unit: EXPECTED_COMPLETED_EXTENDED_15M_GRID_SLOTS
  forward_horizons:
  - 4
  - 16
  - 64
  - 192
  - 320
  primary_horizon: 64
  rationale: One standard extended-session worth of slots is primary; one/four-hour
    and three/five-session slot horizons are descriptive context, not searched.
  anchor: Completed candidate 15m close at event.m15 end_at; must match immutable
    causal input vintage and event price provenance.
  signal_time: Candidate as_of publication time, not an assumed executable order time.
  delayed_input: Signal mark is historical observation; never claim ability to fill
    at that close. No backdated candidate or queued trigger.
  target: Close at the h-th expected completed 15m slot strictly after anchor end_at.
  clock: Official XNYS sessions, frozen 04:00-20:00 ET profile, 64 expected slots
    per supported full session; carry across session boundaries/weekends without counting
    closed time.
  gaps: Count expected slots, never skip gaps to the h-th available bar; unsupported
    sessions cause UNAVAILABLE labels spanning them.
  return_definition: R_h = target_close / anchor_close - 1
  mfe_definition: max(high_j / anchor_close - 1, 0) for j=1..h
  mae_definition: min(low_j / anchor_close - 1, 0) for j=1..h
  path: Strictly subsequent slots only; do not use the trigger bar high/low which
    preceded emission.
  units: Finite positive compatible OHLC with valid grid/identity/provenance. No future
    restatement of anchor or silent vintage mix.
  actions: Reuse existing v3_cash_action_guard eligibility principles. Unknown action
    coverage or any dividend/capital gain/split/other unit-changing action in anchor-to-target
    interval is UNRESOLVED. No reinvestment, dividend return or new action-adjustment
    engine.
  dividend_feature_vs_outcome: Feature normalization does not certify outcome action
    accounting.
  outcome_known_at: Every target/path/action evidence known_at <= separately frozen
    evaluation_as_of; never feed future outcome evidence into signal inputs.
  reference_price_is_fill: false
comparison:
  baseline: SOXX_SAME_LOCAL_15M_SLOT_OTHER_ELIGIBLE_SESSIONS
  control_grid: Latest expected completed atomic 15m inputs with Daily READY/BULLISH,
    exhaustion READY/NORMAL, H1 raw READY, M15 primitive READY and explicit research
    FLAT.
  omitted_control_gates: H1 ACTIVE, M15 extreme/arm/GC/price/trigger and episode consumption;
    do not require them for controls.
  control_scope: Same partition, same America/New_York completed end slot (including
    previous-session date at 20:00), hence same premarket/RTH/postmarket segment.
    Other anchor sessions only.
  control_identity: Unique symbol/completed15m identity; no polling/correction duplicates.
    Control vintage/labels obey identical action/unit/horizon rules.
  control_weight: Equal weight per distinct eligible control session for that slot;
    all eligible sessions, no outcome-based matching or selection.
  minimum_control_sessions_per_event: 10
  control_membership: Eligibility fixed from causal state before label access; candidate-bearing
    other sessions remain eligible controls.
  baseline_return: B_event_h = arithmetic mean of valid same-slot SOXX control R_h
    on other sessions.
  excess_definition: E_event_h = R_event_h - B_event_h
  primary_metric: Equal-weight mean across candidate anchor sessions of each session's
    arithmetic mean E_event_64.
  secondary_metrics: Event-weighted mean R_h and E_h, fixed-horizon MFE/MAE and label
    coverage; descriptive only.
  interpretation: Timing selection relative to same-instrument eligible slot cohort,
    not invested passive NAV, market-neutral alpha or incremental value of each filter.
  SPY: NOT_REQUIRED_NOT_RUN; no compatible admitted SPY intraday/action vintage. Never
    substitute Daily/RTH SPY for extended 15m controls. A later SPY study needs separate
    preregistration.
costs:
  applied: false
  basis: Gross observation marks; commission/spread/slippage cannot be assumed without
    fills. Zero applied cost is not zero actual trading cost.
  after_cost_claims: FORBIDDEN
  execution_cost_decisions: REMAIN_UNRESOLVED
uncertainty:
  method: Joint circular moving-block bootstrap of the full chronological confirmation
    anchor-session grid.
  block_sessions: 5
  samples: 5000
  random_generator: numpy.random.default_rng
  seed: 7
  alpha: 0.05
  interval: Two-sided percentile [0.025, 0.975] using numpy.quantile linear interpolation.
  mechanics: For N anchor sessions, draw ceil(N/5) starts uniformly from 0..N-1 per
    replicate, append five consecutive session indices modulo N, truncate to N. Retain
    all candidate/control anchors and labels of each selected session including repeated
    draws.
  estimand: Recompute per-event other-original-session same-slot controls in every
    draw using draw multiplicities, then event excess and equal-draw-session primary
    mean. Exclude all copies of the event's original session from its controls.
  duplicates: Resampled copies are statistical weights, never new event IDs. Required
    distinct control support is based on original session identities.
  empty_or_invalid_draw: Count and report; if any of 5000 draws has no candidate or
    insufficient control support, inferential interval and PASS/REJECT are UNAVAILABLE.
    Never redraw or silently drop replicates.
  requirements: At least 30 primary-paired candidate events and 20 distinct candidate
    anchor sessions; thresholds fixed as evidence floors, not power guarantees.
  existing_engine_audit: richping.evaluation.block_ci supplies circular block RNG
    mechanics but averages signal dates and treats comparison rows as fixed. It cannot
    directly implement this joint calendar/control estimand; a narrowly scoped adapter
    is required in the later execution action. No new generic evaluation framework.
  limitations: Dependence beyond five anchor sessions and nonstationarity are not
    eliminated; no IID or calibrated forecast claims.
disposition:
  null_hypothesis: Confirmation population timing excess at primary horizon <= 0.
  alternative: Confirmation population timing excess at primary horizon > 0.
  priority:
  - INVALID_INPUT_OR_IDENTITY_COLLISION -> FAIL_CLOSED
  - No candidate events -> ZERO_SIGNAL; metrics/CI null, not zero return and not strategy
    rejection
  - Immature required labels -> PENDING; retain events and evaluate later at recorded
    as_of
  - Any primary candidate/control label unresolved, missing control support, too few
    events/dates or invalid bootstrap draw -> INSUFFICIENT_EVIDENCE
  - Discovery partition -> DESCRIPTIVE_ONLY; never PASS/REJECT
  - Fully mature/valid confirmation and lower95CI > 0 -> PASS_ENTRY_TIMING_EVIDENCE
  - Fully mature/valid confirmation and upper95CI < 0 -> REJECT_POSITIVE_ENTRY_TIMING_HYPOTHESIS
  - Otherwise -> INCONCLUSIVE; failure to reject null is not proof of no effect
  pass_authority: Opportunity research only; no profitability/production promotion,
    trade, risk increase or filter ablation claim.
  minimum_label_coverage_for_inference: 1.0
missing_outcomes:
  states:
  - COMPLETE
  - PENDING
  - UNRESOLVED
  denominator: All immutable candidate events by partition and horizon; all causal
    eligible controls by slot/session, plus excluded/unavailable-grid reasons.
  pending: Expected target slot later than evaluation_as_of or fixed vintage endpoint;
    no fabricated target.
  unresolved: Past expected gap, unsupported session, unit/action uncertainty, future-known
    label at evaluation_as_of, missing hash, incompatible vintage or insufficient
    control support.
  aggregate: COMPLETE descriptive paired subset must show total/complete/pending/unresolved
    denominators and reasons. Never silently discard missing controls or candidates.
    Any incomplete eligible primary control label blocks inferential primary result.
  secondary: Missing secondary labels do not change primary sample; each horizon reports
    its own denominator.
  no_signals: Short-circuit before any market-price, action, benchmark or outcome-store
    read; label counts zero, metrics null.
multiple_testing:
  family_id: H0001_INITIAL_ENTRY_TIMING_EFFICACY_R03_COMPOSER_V1
  primary_tests: 1
  strategy_variants: 1
  primary_horizons:

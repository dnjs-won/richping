source_hypothesis_statements:
- ref: rules.trigger[1]
  text: 그 setup 안에서 15분봉 MACD도 상대적으로 깊은 하방 영역에 있고 골든크로스 또는 확인된 가격 반전이 발생하면 최초 롱 진입 후보가 된다.
- ref: observations[0]
  text: 0선 아래 MACD 골든크로스 뒤 단기 상승이 자주 보였다는 경험적 관찰이 있었으나 빈도와 통계적 유의성은 측정하지 않았다.
- ref: observations[2]
  text: 가격 저점, MACD 최저점, MACD 골든크로스는 동일 시각일 필요가 없으며 MACD의 EMA 평활 특성 때문에 시차가 발생할 수 있다고 논의했다.
- ref: unknowns[6]
  text: 1시간봉과 15분봉의 하방 extreme threshold
- ref: unknowns[9]
  text: 15분봉 골든크로스만으로 trigger를 확정할지 가격 반전 조건도 필수로 할지

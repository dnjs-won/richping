decisions:
  H1-SESSION:
    classification: C1_IMPLEMENTATION_BLOCKER
    question: Intraday 15m/1H에서 RTH만 사용할지 extended hours도 사용할지?
    current_hypothesis_statement: Intraday session choice was unknown in r03; Daily regime session is a separate decision.
    available_v2_primitive: XNYS_RTH and US_EQUITY_EXTENDED_04_20 intraday profiles
    candidate_choices:
    - RTH
    - RTH plus extended (requires new data/feature contracts)
    source_refs:
    - unknowns[25]
    - required_data[8]
    required_for_c1: true
    required_for_profitability: true
  H1-DAILY-SESSION:
    classification: C1_IMPLEMENTATION_BLOCKER
    question: Daily regime에 RTH Daily와 extended Daily 중 어느 causal series를 사용할지?
    current_hypothesis_statement: Daily regime is required; its session semantics are unresolved and not selected by H1-SESSION.
    available_v2_primitive: Separate XNYS_RTH Daily and US_EQUITY_EXTENDED_04_20 Daily aggregation capabilities
    candidate_choices:
    - RTH_DAILY
    - EXTENDED_DAILY
    source_refs:
    - unknowns[25]
    - required_data[8]
    required_for_c1: true
    required_for_profitability: true
  H1-BASE:
    classification: C1_IMPLEMENTATION_BLOCKER
    question: 전략 authoritative base input은?
    current_hypothesis_statement: 15m required; technical input must not imply strategy session selection.
    available_v2_primitive: V2-A 15m input
    candidate_choices:
    - 15m
    - finer input would require a separate capability contract
    source_refs:
    - required_data[1]
    required_for_c1: true
    required_for_profitability: true
  H1-DAILY-PRICE-BASIS:
    classification: C1_IMPLEMENTATION_BLOCKER
    question: Research Daily OHLC의 price adjustment 및 point-in-time action convention은?
    current_hypothesis_statement: r03 requires time-aligned Daily OHLCV but does not select raw or adjusted prices; no hypothesis expansion is implied.
    available_v2_primitive: Synthetic unadjusted OHLC with NONE_CONFIRMED actions only; no real PIT adjustment adapter
    candidate_choices:
    - raw OHLC with explicit causal corporate-action guard or accounting
    - point-in-time split-adjusted OHLC with action known_at and versioned vintage
    - point-in-time dividend or total-return adjusted OHLC with explicit transform and action known_at
    source_refs:
    - required_data[0]
    - required_data[3]
    required_for_c1: true
    required_for_profitability: true
  H1-DAILY-FRESHNESS:
    classification: C1_IMPLEMENTATION_BLOCKER
    question: Latest expected completed Daily 대비 stale 또는 missing input의 eligibility 계약은?
    current_hypothesis_statement: Completed then-known Daily is required; r03 does not define stale Daily acceptance and unavailable handling.
    available_v2_primitive: Session calendar and completed known_at context; no freshness selector or policy
    candidate_choices:
    - require the latest expected completed session and fail closed otherwise
    - explicit versioned grace policy with calendar lag, reasons and unavailable behavior
    source_refs:
    - required_data[3]
    - test.leakage_risks[3]
    required_for_c1: true
    required_for_profitability: true
  H1-EMA-SEED:
    classification: C1_IMPLEMENTATION_BLOCKER
    question: EMA seed·signal 시작·가격 field·feature version을 무엇으로 동결할지?

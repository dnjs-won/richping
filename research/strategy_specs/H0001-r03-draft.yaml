state_machine:
  states:
  - DISABLED
  - DAILY_LONG_ALLOWED
  - SETUP_1H_DOWNSIDE
  - ENTRY_READY
  - ACTIVE_SIGNAL
  - ADD_READY
  - EXIT_WATCH_WEAK
  - EXIT_WATCH_STRONG
  - INACTIVE_SIGNAL
  # INACTIVE_SIGNAL: no active long signal, not execution position state.
  # All states are nonterminal. A later causal cycle must re-evaluate Daily
  # permission, a new setup and entry; the old episode cannot reactivate itself.
  transitions:
    # Both return edges delegate split/priority/reset to the existing unresolved
    # H1-STATE-TRANSITIONS contract, with H1-DAILY-LONG/H1-DAILY-BLOCKER inputs.
    # These are references, not resolved predicates or new trading decisions.
    inactive_daily_permission:
      from: INACTIVE_SIGNAL
      to: DAILY_LONG_ALLOWED
      condition:
        kind: contract
        value:
          name: existing_contract_reference
          version: v1
          parameters:
            path:
              kind: text
              value: state_machine_parameters.transition_priority_and_resets
              choices: []
              decision_id: null
        choices: []
        decision_id: H1-STATE-TRANSITIONS
      prerequisites:
      - H1-DAILY-LONG
      - H1-DAILY-BLOCKER
      - H1-STATE-TRANSITIONS
    inactive_daily_disabled:
      from: INACTIVE_SIGNAL
      to: DISABLED
      condition:
        kind: contract
        value:
          name: existing_contract_reference
          version: v1
          parameters:
            path:
              kind: text
              value: state_machine_parameters.transition_priority_and_resets
              choices: []
              decision_id: null
        choices: []
        decision_id: H1-STATE-TRANSITIONS
      prerequisites:
      - H1-DAILY-LONG
      - H1-DAILY-BLOCKER
      - H1-STATE-TRANSITIONS
    daily_permission:
      from: DISABLED
      to: DAILY_LONG_ALLOWED
      condition:
        kind: contract
        value: UNRESOLVED
        choices: []
        decision_id: H1-STATE-TRANSITIONS
      prerequisites:
      - H1-DAILY-LONG
      - H1-DAILY-BLOCKER
      - H1-STATE-TRANSITIONS
    downside_setup:
      from: DAILY_LONG_ALLOWED
      to: SETUP_1H_DOWNSIDE
      condition:
        kind: contract
        value: UNRESOLVED
        choices: []
        decision_id: H1-STATE-TRANSITIONS
      prerequisites:
      - H1-RELATIVE-METHOD
      - H1-DOWNSIDE
      - H1-SETUP-LIFETIME
      - H1-STATE-TRANSITIONS
    entry_candidate:
      from: SETUP_1H_DOWNSIDE
      to: ENTRY_READY
      condition:
        kind: contract
        value: UNRESOLVED
        choices: []
        decision_id: H1-STATE-TRANSITIONS
      prerequisites:
      - H1-M15-RELATIVE-METHOD
      - H1-M15-DOWNSIDE
      - H1-M15-GC
      - H1-M15-REVERSAL
      - H1-M15-CONJUNCTION
      - H1-STATE-TRANSITIONS
    enter_intent_emitted:
      from: ENTRY_READY
      to: ACTIVE_SIGNAL
      condition:
        kind: contract
        value: UNRESOLVED
        choices: []
        decision_id: H1-STATE-TRANSITIONS
      prerequisites:
      - H1-DECISION-TIMING
      - H1-STATE-TRANSITIONS
    failed_reversal_add_candidate:
      from: ACTIVE_SIGNAL
      to: ADD_READY
      condition:
        kind: contract
        value: UNRESOLVED
        choices: []
        decision_id: H1-STATE-TRANSITIONS
      prerequisites:

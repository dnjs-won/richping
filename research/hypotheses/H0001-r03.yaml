notes: >-
  r03은 r02의 구세션 감사에서 보존한 반례와 미정 사항을 유지하면서, 이 세션에서 더 최근에
  구체화된 전략을 canonical DRAFT로 반영한다. 현재 우선 구조는 Daily regime → 1H relative
  downside extreme → 15m relative downside extreme + reversal/GC 진입 → HH/HL 유지 중 HOLD
  → 1H momentum deterioration/upper extreme EXIT-WATCH → 15m HH failure/LH/valid-HL break
  청산이다. 첫 반전 실패 후 더 깊은 상대 극단에서 새 반전이 확인되면 capped scale-in/re-entry
  후보를 둔다. 4H 숏 아이디어와 5m/1m 세부 타점은 핵심 규칙에서 분리해 보존한다.
  이 파일은 여전히 DRAFT이며 threshold, regime, causal swing, sizing, 비용, metric,
  decision rule이 확정되지 않았으므로 실행 가능한 전략 사양이 아니다. backtest,
  experiment, validation, production/paper 변경은 수행하지 않는다.

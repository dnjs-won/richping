  decision_rule: "unknown"
  cost_assumption: "unknown"
  sample_unit: "unknown - signal event 또는 completed trade 후보이나 확정하지 않았다."
  discovery_period: null
  confirmatory_period: null
  leakage_risks:
    - "NOK 및 2026-09-23~2026-09-25 SOXX 사례를 보며 규칙을 형성했으므로 해당 사례들은 독립적인 확증 증거로 재사용하지 않는다."
    - "사후적으로 확인된 가격 저점/고점, MACD 극값, HH/HL/LH/LL을 당시 이미 알려진 값처럼 사용하면 look-ahead leakage가 발생한다."
    - "rolling relative MACD 계산에 미래 관측치를 포함하면 leakage가 발생한다."
    - "완성되지 않은 1시간봉/일봉 값을 하위 시간축 시점에서 사용하면 미래정보 누출이 발생한다."
    - "k-bar/fractal pivot을 pivot timestamp부터 사용하고 실제 confirmation delay를 무시하면 미래정보 누출이 발생한다."
    - "여러 timeframe, relative MACD 정의, threshold, PA swing 정의, exit 변형을 반복 탐색한 뒤 가장 좋은 조합만 보고하면 multiple-testing bias가 발생한다."
    - "최근 SOXX 랠리에서 발견한 패턴을 같은 구간에서 튜닝·평가하면 discovery/confirmation contamination이 발생한다."
    - "거래량·오더블록·옵션 흐름의 사후 원인 설명을 사전 정의 없이 규칙으로 변환하면 narrative bias가 발생한다."
  multiple_testing_family: "unknown - regime, relative-MACD normalization/threshold, multi-timeframe trigger, scale-in, swing/BOS, exit-watch 후보군을 experiment 등록 전에 고정해야 한다."


    - "사후적으로 확인된 고점·저점을 이용해 MACD 극대·극저 또는 swing point를 정의하면 look-ahead leakage가 발생한다."
    - "완성되지 않은 1시간/4시간/일봉 값을 하위 시간축 시점에서 사용하면 미래정보 누출이 발생한다."
    - "여러 시간축, MACD 변형, PA 정의, threshold를 반복 탐색한 뒤 가장 좋은 조합만 보고하면 multiple-testing bias가 발생한다."
    - "SOXX의 특정 최근 랠리에서 발견한 패턴을 다른 시기·종목에 그대로 일반화하면 selection/regime bias가 발생할 수 있다."
    - "거래량·오더블록에 대한 사후 원인 설명을 규칙으로 변환할 경우 별도 사전 정의 없이 narrative bias가 발생할 수 있다."
  multiple_testing_family: "unknown - MACD 시간축/극값/기울기/0선 위치/가격구조 정의의 후보군을 확정한 뒤 등록해야 한다."


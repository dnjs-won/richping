title: "멀티타임프레임 MACD 모멘텀 전환과 가격구조를 결합한 방향·진입·청산 가설"
thesis: >-
  MACD의 절대적인 골든/데드크로스 하나로 방향을 결정하지 않고, 상위 시간축의 추세 문맥과
  MACD 모멘텀의 극대·극저 및 기울기 변화를 경고 신호로 사용한 뒤, 더 짧은 시간축의
  가격행동(price action)에서 실제 추세 구조 변화가 확인될 때 진입·청산하면 단순 MACD
  교차보다 추세의 유효 구간을 더 많이 포착할 수 있다는 연구 가설이다. 현재 대화에서
  아이디어만 형성되었으며 수익성·재현성은 검증되지 않았다.

source:
  type: chat
  discussion_date: "2026-09-25"
  reference: null
  issue: null

observations:
  - "SOXX 차트 관찰에서 MACD가 고점 부근에서 데드크로스한 뒤에도 가격이 다시 상승하여, 데드크로스만으로 최종 고점이나 지속 하락을 판정하기 어렵다고 보았다."
  - "2026-09-23의 SOXX 1시간봉 고점 부근 사례를 검토하면서, 1시간봉 데드크로스를 확정 신호로 기다리면 후속 상승 구간을 놓칠 수 있다는 문제가 제기되었다."
  - "MACD 시그널선 또는 MACD 모멘텀의 기울기가 음수로 전환되는 시점을 극댓값 이후의 조기 경고 후보로 논의했다."
  - "MACD가 0선 근처에서도 다시 꺾일 수 있으므로, 절대적인 0선 위치만으로 매도 감시 여부를 제한하면 일부 하락 전환을 놓칠 가능성이 있다고 보았다."
  - "반대로 0선 근처의 모든 기울기 변화를 신호로 사용하면 노이즈에 의해 너무 일찍 청산될 가능성이 있다는 문제도 제기되었다."
  - "가격 추세의 실제 붕괴는 MACD 자체보다 HH/HL 구조가 더 이상 유지되지 않는 가격행동에서 확인해야 한다는 방향으로 논의가 수렴했다."
  - "MACD는 가격구조 붕괴 전에 경고를 주는 보조 역할, 가격행동은 실제 전환 확인 역할로 분리하는 아이디어를 논의했다."
  - "4시간봉 하락 근거만으로 숏을 잡고 장시간 방치한 사례는 근거가 약했으며, 특히 일봉 상승 추세와 충돌한 상태에서 4시간봉 음의 히스토그램 진행만으로 숏 방향을 확정한 것이 문제라고 평가했다."
  - "일봉 상승 추세가 유지되는 동안에는 짧은 시간축의 하락 신호를 장기 숏 근거로 확대하지 않는 방향을 논의했다."
  - "숏 후보로는 일봉이 과도하게 상승한 상태에서 일봉 MACD 이격이 큰 뒤 하락 전환이 나타나는 경우를 별도 아이디어로 언급했지만, 정량 정의는 정하지 않았다."
  - "과거 관찰에서 0선 아래 MACD 골든크로스 뒤 단기 상승이 자주 보였다는 경험적 관찰이 있었으나, 빈도나 통계적 유의성은 측정하지 않았다."
  - "4시간봉은 큰 방향/모멘텀 문맥, 1시간봉은 중간 상태와 경고, 15분봉은 더 세밀한 가격행동 확인에 사용하는 구성을 논의했다."
  - "1분봉은 반응은 빠르지만 추세가 쉽게 뒤집혀 노이즈가 크다는 관찰이 있었고, 단독 방향 판단에는 부적합할 수 있다고 보았다."
  - "고점 부근에서 거래량 증가와 MACD 이격 확대가 함께 나타나는 패턴을 추격매수 또는 물량 출회 가능성과 연결해 관찰했으나, 원인 해석은 검증되지 않았다."
  - "특정 가격대에서 반복적으로 매수세가 나타나는 현상을 지지/오더블록 가능성으로 관찰했으나, 이를 MACD 전략의 필수 규칙으로 확정하지 않았다."

rules:
  regime:
    - "상위 시간축의 방향 문맥을 하위 시간축 신호보다 우선해서 해석한다."
    - "일봉 상승 추세 중의 4시간봉 하락 MACD 신호만으로 장기 숏 방향을 확정하지 않는다."
    - "일봉 추세를 어떤 수식으로 상승/하락/과열 상태로 분류할지는 unknown이다."
    - "주봉·월봉을 실제 거래 필터로 사용할지, 단순 참고 문맥으로만 사용할지는 unknown이다."
  setup:
    - "MACD의 극대·극저, 이격 확대/축소, 히스토그램 변화, 기울기 변화는 추세 전환 가능성을 감시하기 위한 setup 후보이다."
    - "1시간봉 MACD의 하방 기울기 변화는 롱 포지션의 매도 감시 시작 후보로 논의되었으나, 0선 위치와 결합할지 여부는 확정되지 않았다."
    - "고점 부근의 거래량 증가와 MACD 이격 확대를 exhaustion 후보 특징으로 고려했으나 필수 조건으로 확정하지 않았다."
  trigger:
    - "MACD 경고만으로 즉시 거래하지 않고 가격행동에서 추세 구조 변화 확인을 결합한다."
    - "롱 추세 붕괴 확인 후보는 HH가 더 이상 형성되지 않고 이후 가격구조가 약화되는 패턴이다."
    - "15분봉을 가격행동 확인 시간축으로 사용하는 방향을 논의했으나, 정확한 swing 정의와 몇 개 봉을 확인해야 하는지는 unknown이다."
    - "롱 진입은 MACD 교차 또는 가격 반전이 나타난 뒤 확인된 방향을 추종한다는 기존 매매 방식을 후보 규칙으로 보존한다."
    - "진입에서 4시간봉·1시간봉·15분봉을 정확히 어떤 순서와 논리식으로 결합할지는 unknown이다."
  exit:
    - "MACD의 하방 변화는 즉시 매도가 아니라 매도 감시를 활성화하는 경고로 사용하는 방향을 우선 가설로 둔다."
    - "실제 청산은 가격행동에서 상승 구조가 깨지는 것을 확인하는 방식이 후보이다."
    - "MACD 데드크로스까지 기다리는 방식은 지연되어 상승분을 크게 반납할 수 있다는 문제를 검토 대상으로 둔다."
    - "시그널선 또는 MACD 기울기의 극댓값 이후 음의 전환을 더 빠른 경고로 사용할 수 있는지 검토 대상으로 둔다."
    - "부분청산, 전량청산, trailing 방식 중 무엇을 사용할지는 unknown이다."
  invalidation:
    - "MACD 교차 하나만으로 방향을 확정하는 단순 규칙은 현재 가설의 충분조건으로 취급하지 않는다."
    - "상위 시간축과 충돌하는 하위 시간축 신호를 장시간 무감시 포지션의 단독 근거로 사용하는 것은 현재 가설과 맞지 않는다."
    - "HH/HL, LH/LL 및 구조 붕괴의 기계적 정의가 정해지기 전에는 실행 가능한 전략으로 간주하지 않는다."


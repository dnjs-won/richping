notes: >-
  이 파일은 2026-09-25까지의 채팅 논의를 정규화해 보존한 DRAFT 연구 가설이다.
  관찰과 해석은 증거가 아니며, 현재 champion·production recommendation·risk·paper 계약을
  변경하지 않는다. 사용자는 아직 검증을 요청하지 않았으므로 experiment를 생성하거나
  backtest/validation을 실행하지 않는다. 특히 'MACD는 극대에서 극저까지 스윙한다',
  '일봉 상승 추세에서는 0선 근처에서 쉽게 꺾이지 않는다', '고점 거래량 증가는 세력의
  물량 출회다', '특정 가격대에는 오더블록이 있다' 같은 설명은 검증된 사실로 승격하지 않는다.

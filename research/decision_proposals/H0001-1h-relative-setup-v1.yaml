    - {ref: 'rules.setup[1]', text: '절대 MACD 값이나 미래에 확정되는 최종 극저점 대신 rolling percentile, ATR 정규화, rolling z-score 등 당시 계산 가능한 상대 위치를 사용한다는 원칙을 둔다.'}

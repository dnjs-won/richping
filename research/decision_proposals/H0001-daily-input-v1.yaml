  PIT_SPLIT_ADJUSTED:
    meaning: apply_only_split_information_known_by_as_of_with_explicit_factor_units_and_vintage
    risk: current_provider_backward_adjustment_can_include_future_splits
  PIT_DIVIDEND_OR_TOTAL_RETURN_ADJUSTED:

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "richping"
version = "0.1.0"
description = "Small automated equity recommendation and outcome engine"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "exchange-calendars>=4.11,<5", "tzdata>=2025.2"]

[project.optional-dependencies]
data = ["yfinance>=0.2.65,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
richping = "richping.cli:main"

[tool.setuptools.packages.find]
include = ["richping*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-o cache_dir=var/.pytest_cache"


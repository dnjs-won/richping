next_action:
  id: H0001_DAILY_PIT_AND_MIXED_PROFILE_PREREQUISITES
  priority: P0
  status: READY
  blocks_phase_exit_criteria:
    - 4
    - 5
    - 6
  objective: Supply verified frozen RTH_DAILY/PIT_SPLIT_ADJUSTED_OHLC Daily inputs, sufficient common
    warmup, freshness and mixed-profile as-of join before composed H0001 entry events.
  why_now: '15m freeze is complete. Full preserved Daily+1H+15m composition is impossible with the41-session
    Yahoo snapshot: trend179 and exhaustion381 warmup plus RTH/PIT actions/freshness/join are missing.
    This is a current phase P0 prerequisite rather than an optional provider expansion.'
  constraints:
    - Preserve frozen Daily input/trend/exhaustion, 1H and new15m records; no outcome-driven changes.
    - Trend requires179 and exhaustion NORMAL requires381 completed Daily observations; no warmup
      reduction.
    - No Extended Daily substitution, stale/raw fallback, inferred actions or fabricated historical
      PIT known_at.
    - Use immutable saved vintages; network only explicit ingestion/update.
    - Demonstrate actual action evidence/effective_at/known_at and transformation basis or record
      a concrete provider/PIT blocker.
    - No profitability, exit/add/risk/portfolio/order work or main integration.
  acceptance_criteria:
    - One immutable SOXX RTH_DAILY vintage with verified frozen PIT split/action evidence and consistent
      OHLC units is saved and reloaded offline.
    - Daily trend179 and exhaustion381 joint readiness are met on the chosen eligible history without
      changing frozen numerical contracts.
    - Latest-expected-completed Daily selector fails closed at official close/delayed delivery and
      retains actual required evidence known_at.
    - A minimal as-of join preserves separate RTH Daily and extended1H/15m identities and current
      authoritative references; no concatenated candle stream or partial inputs.
    - Offline mechanical readiness/join tests pass; no performance claims. If verified historical
      PIT cannot be supplied, record the exact blocker and affected phase exits rather than manufacture
      data.
  after_success:
    - H0001_ENTRY_EXECUTION_AND_COMPOSITION
    - H0001_FIRST_ENTRY_EFFICACY


current_phase:
  id: H0001_FIRST_REAL_EVIDENCE
  objective: >
    Produce the first reproducible H0001 entry-efficacy evidence from real intraday
    market data without weakening causal/data-quality contracts.
  user_visible_outcome: >
    A reproducible report showing actual signal count, forward returns, MFE/MAE,
    matched benchmark comparison and uncertainty from a fixed real dataset.
  status: BLOCKED_ON_DAILY_PIT_AND_MIXED_PROFILE_PREREQUISITES
  progress:
    satisfied_exit_criteria:
      - 1
      - 2
      - 3
    remaining_exit_criteria:
      - 4
      - 5
      - 6
    actual_evidence: |-
      SOXX Yahoo 15m 2026-08-05 through 2026-10-01, 2624 expected/observed bars, 902 premarket / 1066 RTH / 656 post, no gaps or unsupported sessions in this range. Immutable v1/v2 persisted; repeated network-disabled reload and completed aggregation/event iteration have identical identities.
       Ex-ante v12 minimal15m tuple is frozen; offline SOXX MACD READY2495, relative READY2304/UNAVAILABLE320, extreme270, GC92, ungated15m triggers2. Repeated read-only exercise identical with network disabled; composed ENTRY_CANDIDATE=null/NOT_EVALUATED; profitability NOT_RUN.
    limitations: |-
      Historical bar-end known_at is a research assumption, not live/shadow PIT. Corporate actions remain UNKNOWN; extended volume zero is not no-trade proof. Yahoo's 60-day 15m window does not provide frozen Daily 179-observation warmup or RTH/PIT action input. Generic extended Daily aggregates do not replace it.
       The separate frozen Daily exhaustion NORMAL classifier requires381 observations, beyond trend179. Current41 sessions, RTH/PIT action evidence/freshness/mixed-profile join cannot enable full Daily+1H+15m composition. Exit4 tuple semantics/pure primitives are satisfied but upstream executability is not; exits4/5/6 remain blocked.
    blocked_exit_criteria:
      - 4
      - 5
      - 6
    frozen_15m_subtask: COMPLETE_NOT_FULL_PHASE_EXIT_4

  exit_criteria:
    - "A real 15m dataset is persisted locally with immutable dataset identity/provenance."
    - "The dataset covers the required 04:00-20:00 ET research session with explicit gap/availability diagnostics."
    - "Repeated research/replay can reload the fixed dataset without network/API calls."

source_of_truth:
  project_goal:
    branch: main
    path: PROJECT_SPEC.md
  pm_charter:
    branch: main
    path: PM_CHARTER.md
  ai_bootstrap:
    branch: main
    path: AGENTS.md
  legacy_status:
    branch: main
    path: PROJECT_STATUS.md
  active_workstream_status:
    branch: v2-c0-extended-session-contract
    path: PROJECT_STATUS.md
  decision_index:
    branch: main
    path: project/DECISION_INDEX.yaml
  backlog:
    branch: main

next_action:
  id: H0001_MINIMAL_15M_ENTRY_FREEZE
  priority: P1
  status: READY
  objective: >
    Freeze one minimal 15m initial-entry tuple plus at most one comparator using
    the fixed real SOXX intraday dataset, preserving the frozen Daily and 1H contracts.
  why_now: >
    A measured full-session real 15m vintage can now be reloaded offline. The 15m
    proposal remains unresolved; select the smallest executable contract before
    composition and efficacy. No Cartesian parameter search or profitability claim.
  constraints:
    - "Preserve existing synthetic V2 tests and causal contracts."
    - "Use saved immutable data; network remains an explicit ingestion/update concern only."
    - "Preserve frozen Daily/1H decisions; do not infer 15m values from 1H."
    - "Do not lower warmup, invent PIT availability/actions, or fill gaps."
    - "Research snapshot admission does not satisfy frozen RTH/PIT Daily input."
    - "No exit/add/risk/portfolio/order implementation or Cartesian parameter search."
    - "Do not claim provider/chart parity until measured."
  acceptance_criteria:
    - "One minimal initial-entry tuple and at most one comparator are recorded as an immutable decision."
    - "Readiness, units, polarity, reversal, temporal composition and same-batch decision timing are explicit."
    - "Real saved intraday data can exercise the selected primitives offline; no outcome-driven grid search."
    - "Existing frozen Daily/1H decisions and hypothesis revision are preserved."
    - "Remaining Daily/PIT/mixed-profile prerequisites are explicit before executable composition/efficacy."
  after_success:
    - "Implement the executable 15m trigger/composer."
    - "Satisfy separately tracked frozen Daily input/mixed-profile prerequisites before claiming composed events."
    - "Run the first real-data H0001 entry efficacy experiment."

